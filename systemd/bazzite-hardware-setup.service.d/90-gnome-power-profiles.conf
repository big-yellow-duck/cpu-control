# Preserve the user's opt-in to GNOME power profiles after handheld hardware setup.
# TuneD supplies governor/EPP and platform profiles; SteamOS Manager retains TDP.
[Service]
ExecStartPost=/usr/bin/systemctl unmask tuned.service tuned-ppd.service
ExecStartPost=/usr/bin/systemctl --no-block start tuned-ppd.service
